  - id: minimax-ecosystem-dossier
    title: 'Research MiniMax ecosystem: M3, Agent Framework, macOS Desktop App'
    role: produce
    prompt: |
      You are the Researcher in a 3-stage Producer ➔ Trust loop orchestrated by Mavis (chief of staff). Andre is designing Phase 3 of Mavis's evolution. To do this, he needs deep intelligence on the MiniMax ecosystem as of mid-2026.

      ## Your deliverable

      Write a comprehensive dossier to: `/Users/brassfieldventuresllc/MiniMax-Agent/03 Projects/Researcher/dossiers/minimax_ecosystem_2026.md`

      The dossier must cover three sub-topics in depth. Every factual claim must be tied to a numbered source reference (e.g. `src-2026-06-05-001`); no source = no claim. Mark anything that cannot be sourced as `UNVERIFIED — needs follow-up` rather than dropping or fabricating it. Andre's Producer ➔ Trust loop rejects unverified claims as failures.

      ### Sub-topic 1 — MiniMax M3
      - Context window: total token limit, effective usable window, any MSA/sparse-attention behavior
      - Rate-limit structures: requests per minute (RPM), tokens per minute (TPM), requests per day (RPD), burst behavior, tier-based differences (free / pro / enterprise)
      - Tool-use latency: p50 / p95 / p99 latencies for tool-call round-trips, where available
      - Reasoning capabilities vs M2.7: explicit benchmark deltas (MMLU, GPQA, HumanEval, SWE-bench, lmarena ELO, Artificial Analysis intelligence index, Vellum AI, Hugging Face leaderboards) — quote numbers, attribute to sources
      - Native multimodal capability: image / video / audio input + output specs
      - Long-horizon / thinking-mode toggle details

      ### Sub-topic 2 — MiniMax Agent Framework
      - Multi-agent orchestration: how MiniMax natively routes between agents, the dispatch model, parallelism, the agent-as-tool pattern
      - State management: checkpointing, persistence, session rotation, the relationship between sessions and tasks
      - Memory: short-term (in-context), long-term (file-system, vector, MEMORY.md style), semantic, the canonical memory hierarchy
      - Skills system: what a MiniMax skill is, how it is loaded, how routing works (auto vs explicit)
      - Hooks / cron / event system: how the framework handles time-based and event-based triggers
      - Terminal backends: local / docker / SSH / others
      - Comparison to Claude Agent SDK, OpenAI Codex / Agents SDK, LangChain deepagents, Google ADK — where MiniMax leads, where it lags

      ### Sub-topic 3 — MiniMax macOS Desktop App
      - Install footprint: how it ships (App Store / DMG / Homebrew / company-issued)
      - Native OS integration: what system permissions it requests, what it does with them
      - Local file-system access: scoped to the user's project, or system-wide? How does the sandbox work?
      - Terminal execution: can it spawn local shells? Sandbox / container / direct?
      - Local REST API hooks: does it expose a localhost endpoint for orchestration? Document the port, auth model, and surface
      - Capability delta vs the cloud API: what can the desktop app do that the API cannot, and vice versa? Where do they share a model and where do they diverge?
      - Voice / computer-use / vision modules: which are bundled, which require explicit opt-in, which are absent
      - Existing fleet posture: how does it fit alongside Claude Code, Codex CLI, Cursor, OpenCode?

      ## Style, structure, voice

      Read 2-3 existing dossiers in `/Users/brassfieldventuresllc/MiniMax-Agent/03 Projects/Researcher/dossiers/` first (`harness-engineering.md`, `frontier_ai.md`, `ai-landscape.md`) to match voice, density, frontmatter, and source-trail format. The new dossier follows the same skeleton:

      - Frontmatter (one-paragraph topic framing + cross-references)
      - "Why this topic matters to Andre"
      - "Current signal" with sub-sections (one per sub-topic above)
      - "Source trail" (numbered `src-YYYY-MM-DD-NNN` references with URL + access date + 1-line excerpt)
      - "Contradictions and open questions"
      - "Implications" (Build / Content / Watch / Verify)
      - "Routing history"

      Cross-link to `ai-landscape.md`, `frontier_ai.md`, and `harness-engineering.md` where the topic overlaps. Do NOT duplicate prior dossier work — extend, refresh, add new intelligence.

      ## Sources & tools

      - Use the `web_search` native tool (matrix MCP) and the `WebFetch` tool liberally. Run at least 8-12 distinct searches across the three sub-topics. Cross-reference 3+ sources per sub-topic.
      - Prefer primary sources: MiniMax official docs, model cards, the MiniMax GitHub org, benchmark sites (lmarena, Artificial Analysis, Vellum AI, Hugging Face), conference talks.
      - If a search returns nothing useful, mark the claim as UNVERIFIED — never invent numbers, model specs, or URLs.

      ## Hard rules (vault destruction was 2 hours ago — be paranoid)

      1. **Vault Rule:** write the deliverable DIRECTLY to the vault path above. `/tmp/` is forbidden for durable artifacts. The vault is the single source of truth.
      2. **Double-quoted paths** in any shell command. NEVER backslash-escape spaces.
      3. **No git operations** — Mavis (orchestrator) handles commits and pushes. Do not `git add`, `git commit`, `git push`, `git reset`, or modify git state in any way.
      4. **No trash / rm / mv on the vault** — this is what destroyed the vault 2 hours ago. If you need to clean up intermediate files, write to `/tmp/` (which the orchestrator will sweep).
      5. **No recursive `git add <dir>` or `git add .`** — the vault working tree has unrelated unstaged items.
      6. **Do not touch any other file in the dossier directory or anywhere else in the vault** — your only write target is the file path above.
      7. **Do not commit, push, modify config, or send external messages** without explicit orchestrator approval.

      ## Floor

      Minimum 350 lines. Denser is better — every paragraph should add sourced intelligence, not padding. Cover all three sub-topics, not just one. Cross-link to prior dossiers.

      ## Exit condition

      Report back with: the file path, total line count, the count of source references cited, and a 3-sentence summary of the most surprising / most useful findings. The file must exist at the path above, be ≥350 lines, and have all three sub-topics fully covered with source attribution.

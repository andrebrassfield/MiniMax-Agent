  - id: harness-context-dossier
    title: 'Research agent harnesses and context engineering for 100k+ token vaults'
    role: produce
    prompt: |
      You are the Researcher in a 3-stage Producer ➔ Trust loop orchestrated by Mavis. Andre is designing Phase 3 of Mavis's evolution. To do this, he needs intelligence on the industry state-of-the-art in keeping LLMs aligned over long horizons, and on context engineering for vaults that will scale past 100k tokens.

      ## Your deliverable

      Write a comprehensive dossier to: `/Users/brassfieldventuresllc/MiniMax-Agent/03 Projects/Researcher/dossiers/harness_and_context_design.md`

      Every factual claim must be tied to a numbered source reference (e.g. `src-2026-06-05-001`); no source = no claim. Mark anything that cannot be sourced as `UNVERIFIED — needs follow-up` rather than dropping or fabricating it. Andre's Producer ➔ Trust loop rejects unverified claims as failures.

      ### Sub-topic 1 — Agent Harnesses

      The vault already has `/Users/brassfieldventuresllc/MiniMax-Agent/03 Projects/Researcher/dossiers/harness-engineering.md` (built 2026-06-04, ~245 lines). READ IT FIRST. Your job is to EXTEND, not duplicate.

      Specific intelligence requirements:
      - Definitive architectural patterns for wrapping an LLM in a deterministic harness. The 12 components from Pachaar's "Anatomy of an Agent Harness" are the canonical checklist — review, refresh, add 2026 updates.
      - **Framework drift** — what is it (silent accumulation of unused / dead scaffolding as models and tools evolve)? How do modern systems detect and prevent it? Cite Anthropic's "delete the planning step" pattern, Manus's 5-rewrites-in-6-months case, the deepagents scaffolding-removal discipline.
      - **Silent timeouts** — what causes them (worker hang, model rate-limit, lost context, deadlocked state machine)? How are they detected? How is the user notified? Cite Stripe's "cap retries at 2" pattern, watchdog cron patterns, the abort-to-solo heuristic, heartbeat / liveness probes.
      - **Hard-trigger routing** — the failure mode where skills (like `session-boot-sync`) should fire on exact string matches ("Mavis, boot sequence") but rely on LLM probabilistic routing instead. What are the architectural patterns for deterministic skill / command dispatch? Cite Anthropic Skills (Anthropic's Skills spec), OpenAI's GPT Actions / Custom GPTs triggers, MiniMax's skill system, LangChain tool routing, regex / slash-command patterns.
      - **Verification as a first-class component** — Boris Cherny's 2-3x quality improvement claim. The Verifier-as-separate-vantage pattern. How production harnesses embed adversarial verification at every step (the Producer ➔ Trust loop Andre is using).
      - **Lifecycle / scaffolding removal** — when and how to delete harness complexity as models improve. Concrete examples from Manus, Claude Code, deepagents, Hermes.

      ### Sub-topic 2 — Context Engineering for 100k+ Token Vaults

      The vault already has `/Users/brassfieldventuresllc/MiniMax-Agent/03 Projects/Researcher/dossiers/memory_orchestration.md` (stub, ~39 lines, pending first refresh). READ IT FIRST. Your job is to fill the stub with the industry SOTA, not duplicate it.

      Specific intelligence requirements for context engineering in 100k+ token vaults:
      - **Dynamic context injection patterns** — compare and contrast:
        - RAG (vector similarity + metadata filters, e.g. Qdrant, Weaviate, Pinecone, LanceDB)
        - Semantic caching (e.g. GPTCache, LangChain semantic cache, Anthropic prompt cache)
        - Pre-computed summaries (hierarchical summarization, sliding-window, MemGPT-style tiered memory)
        - Hybrid patterns (e.g. Anthropic's 1M-context MSA / sparse attention, Claude's cache-control breakpoints, the Hermes MEMORY.md + Honcho + vector-DB blend)
      - **The lost-in-the-middle problem** — Liu et al. 2023, Lost in the Middle. How do production systems route around it (re-ranking, observation masking, JIT retrieval, subagent isolation)?
      - **Compaction strategies** — when to compact, what to keep, what to drop, how to maintain continuity (the "summary of summaries" pattern, hierarchical compaction)
      - **Index → topic files → raw transcripts** — the 3-tier memory hierarchy. Where each tier lives, when each is loaded, the cost-quality tradeoff.
      - **Observability** — how do you know your context pipeline is working? Token-budget dashboards, retrieval-quality metrics, attention probes, eval harnesses.
      - **The vault at scale** — what breaks first when a vault hits 100k, 500k, 1M tokens? Cite empirical failure modes (latency, retrieval quality, cost).
      - **Concrete vault design** — recommend a specific architecture for Mavis's vault (the Obsidian vault at `/Users/brassfieldventuresllc/MiniMax-Agent/`) that scales from current ~32k tokens of MEMORY.md + topic files to 1M+ without blowing the context window or losing retrieval quality.

      ## Style, structure, voice

      Match the established dossier format. Read `harness-engineering.md` and `memory_orchestration.md` first, then `ai-landscape.md` and `frontier_ai.md` for cross-context. Same skeleton:

      - Frontmatter
      - "Why this topic matters to Andre"
      - "Current signal" with sub-sections
      - "Source trail" (numbered)
      - "Contradictions and open questions"
      - "Implications" (Build / Content / Watch / Verify)
      - "Routing history"

      Cross-link explicitly to `harness-engineering.md` and `memory_orchestration.md` in the frontmatter. Position this dossier as the Phase-3 / 2026-06 refresh that extends both.

      ## Sources & tools

      - Use `web_search` (matrix MCP) and `WebFetch` liberally. Run 8-12 searches across the two sub-topics.
      - Prefer primary sources: Anthropic, OpenAI, MiniMax, LangChain, deepagents, AWS, Google, arXiv, GitHub, conference talks (NeurIPS, ICML, KDD).
      - Cross-reference 3+ sources per sub-topic. Mark unverified claims as UNVERIFIED.

      ## Hard rules (vault destruction was 2 hours ago — be paranoid)

      1. **Vault Rule:** write the deliverable DIRECTLY to the vault path above.
      2. **Double-quoted paths** in any shell command. NEVER backslash-escape spaces.
      3. **No git operations.** Mavis (orchestrator) handles commits and pushes.
      4. **No trash / rm / mv on the vault.** Use `/tmp/` for intermediate files.
      5. **No recursive `git add <dir>` or `git add .`.**
      6. **Do not touch any other file in the vault.** Your only write target is the file path above.
      7. **Do not commit, push, modify config, or send external messages** without explicit orchestrator approval.

      ## Floor

      Minimum 350 lines. Denser is better — every paragraph should add sourced intelligence, not padding.

      ## Exit condition

      Report back with: the file path, total line count, count of source references, and a 3-sentence summary of the most surprising / most actionable findings. The file must exist, be ≥350 lines, and cover both sub-topics fully with source attribution.
